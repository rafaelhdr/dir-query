server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    ssi on;

    location /partials/ {
        internal;
    }

    location /files/ {
        alias /data/uploads/;
    }

    location ~ ^/w/[^/]+/ask/conversations/?$ {
        try_files /w/ask/conversations/index.html =404;
    }

    location ~ ^/w/[^/]+/ask/[0-9]+/?$ {
        try_files /w/ask/index.html =404;
    }

    location ~ ^/w/[^/]+/ask/?$ {
        try_files /w/ask/index.html =404;
    }

    location ~ ^/w/[^/]+/?$ {
        try_files /w/ask/index.html =404;
    }

    location ~ ^/w/[^/]+/feed/files/?$ {
        try_files /w/feed/files/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # SSE streaming endpoint only: needs buffering off to actually stream
    # (rather than nginx collecting the full response first) plus a longer
    # read timeout as a safety margin. Matched separately so regular JSON
    # endpoints below keep nginx's normal buffering/60s timeout.
    location ~ ^/api/(w/[^/]+/ask)$ {
        proxy_pass http://backend:8000/$1;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
    }
}
