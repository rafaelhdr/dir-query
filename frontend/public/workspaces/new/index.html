<!doctype html>
<html lang="en">
  <head>
    <!--#set var="page_title" value="New Workspace — Dir Query" -->
    <!--#include virtual="/partials/head.html" -->
  </head>
  <body>
    <!--#include virtual="/partials/nav.html" -->

    <!--#set var="page_heading" value="New Workspace" -->
    <!--#include virtual="/partials/heading.html" -->

    <div x-data="newWorkspaceForm()">
      <div id="form-error" x-text="error"></div>

      <form
        id="new-workspace-form"
        @submit.prevent="submit('/api/workspaces', $event, (data) => window.location = '/w/' + data.slug + '/ask')"
      >
        <p>
          <label>
            Name
            <input type="text" name="name" required />
          </label>
        </p>
        <p>
          <label>
            Description
            <textarea name="description" rows="3"></textarea>
          </label>
        </p>

        <details id="advanced-section">
          <summary>Advanced</summary>

          <fieldset>
            <legend>API key</legend>

            <p>
              <label>
                <input type="radio" name="key_source" value="system" x-model="keySource" />
                System API keys
              </label>
              <br />
              <small
                >Uses this deployment's shared API keys. Free, but limited
                &mdash; it might fail under heavy use.</small
              >
            </p>
            <p>
              <label>
                <input type="radio" name="key_source" value="dedicated" x-model="keySource" />
                Dedicated
              </label>
              <br />
              <small
                >Use your own API key. You provide the key, and usage is
                charged to your own account.</small
              >
            </p>

            <div id="dedicated-key-fields" x-show="isDedicated">
              <p>
                <label>
                  <input type="radio" name="key_provider" value="gemini" x-model="keyProvider" />
                  Gemini
                </label>
                <label>
                  <input type="radio" name="key_provider" value="minimax" x-model="keyProvider" />
                  MiniMax
                </label>
              </p>
              <p>
                <label id="api-key-label">
                  <span x-text="apiKeyLabel"></span>
                  <input
                    type="password"
                    name="api_key"
                    autocomplete="off"
                    :required="isDedicated"
                  />
                </label>
              </p>
            </div>
          </fieldset>
        </details>

        <button type="submit" :disabled="submitting">Create workspace</button>
      </form>
    </div>

    <script>
      function newWorkspaceForm() {
        // Getters must be defined directly on the returned object literal.
        // Object.assign(apiForm(), { get isDedicated() {...} }) would
        // evaluate the getter once at merge time and copy its *value*,
        // not the accessor itself, freezing it instead of staying reactive.
        return {
          ...apiForm(),
          keySource: "system",
          keyProvider: "gemini",
          get isDedicated() {
            return this.keySource === "dedicated";
          },
          get apiKeyLabel() {
            return this.keyProvider === "minimax" ? "MiniMax API key" : "Google API key";
          },
        };
      }
    </script>

    <!--#include virtual="/partials/footer.html" -->
  </body>
</html>
