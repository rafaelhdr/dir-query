<!doctype html>
<!-- Origami Geometric — restrained tier (see DESIGN.md). -->
<html lang="en">
  <head>
    <!--#set var="page_title" value="Workspaces — Dir Query" -->
    <!--#include virtual="/partials/head.html" -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="/marked.min.js"></script>
    <script src="/purify.min.js"></script>
  </head>
  <body class="origami-world origami-page">
    <!--#include virtual="/partials/nav.html" -->

    <!--#set var="page_heading" value="Workspaces" -->
    <!--#include virtual="/partials/heading.html" -->

    <p class="page-intro">Browse your workspaces, or create a new one to start asking questions about your documents.</p>

    <div class="page-actions">
      <a class="origami-button-primary" href="/workspaces/new">Create a new workspace</a>
    </div>

    <div x-data="workspacesPage()" x-init="load()">
      <ul id="workspace-list">
        <template x-for="workspace in workspaces" :key="workspace.id">
          <li>
            <a :href="'/w/' + workspace.slug + '/ask'" x-text="workspace.name"></a>
            <div
              class="workspace-description"
              x-show="workspace.descriptionHtml"
              x-html="workspace.descriptionHtml"
            ></div>
          </li>
        </template>
      </ul>
      <p id="empty-message" x-show="loaded && workspaces.length === 0">
        No workspaces yet. <a href="/workspaces/new">Create one</a> to get
        started.
      </p>
    </div>

    <script>
      // Force every link markdown produces to open safely in a new tab,
      // regardless of what the description's markdown source specified.
      DOMPurify.addHook("afterSanitizeAttributes", function (node) {
        if (node.tagName === "A") {
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noopener noreferrer");
        }
      });

      const MARKDOWN_ALLOWED_TAGS = [
        "p",
        "strong",
        "em",
        "ul",
        "ol",
        "li",
        "br",
        "code",
        "pre",
        "blockquote",
        "a",
      ];
      const MARKDOWN_ALLOWED_ATTR = ["href", "target", "rel"];

      // A workspace description is user-supplied, so it's untrusted.
      // marked() only parses markdown into HTML — it does not sanitize —
      // so every conversion is run through DOMPurify with a conservative
      // allowlist before the result is bound via x-html.
      function renderMarkdown(text) {
        const rawHtml = marked.parse(text);
        return DOMPurify.sanitize(rawHtml, {
          ALLOWED_TAGS: MARKDOWN_ALLOWED_TAGS,
          ALLOWED_ATTR: MARKDOWN_ALLOWED_ATTR,
        });
      }

      function workspacesPage() {
        return {
          workspaces: [],
          loaded: false,
          async load() {
            const response = await fetch("/api/workspaces");
            const workspaces = await response.json();
            this.workspaces = workspaces.map(function (workspace) {
              return Object.assign({}, workspace, {
                descriptionHtml: workspace.description
                  ? renderMarkdown(workspace.description)
                  : "",
              });
            });
            this.loaded = true;
          },
        };
      }
    </script>

    <!--#include virtual="/partials/footer.html" -->
  </body>
</html>
