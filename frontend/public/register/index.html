<!doctype html>
<html lang="en">
  <head>
    <!--#set var="page_title" value="Register — Dir Query" -->
    <!--#include virtual="/partials/head.html" -->
  </head>
  <body>
    <!--#include virtual="/partials/nav.html" -->

    <!--#set var="page_heading" value="Register" -->
    <!--#include virtual="/partials/heading.html" -->

    <div x-data="apiForm()">
      <div id="form-error" x-text="error"></div>

      <form
        id="register-form"
        @submit.prevent="submit('/api/auth/register', $event, (data) => { Auth.setSession(data.token, data.email); window.location = '/workspaces'; })"
      >
        <p>
          <label>
            Email
            <input type="email" name="email" required />
          </label>
        </p>
        <p>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
        </p>
        <button type="submit" :disabled="submitting">Register</button>
      </form>
    </div>

    <p><a href="/login">Already have an account? Log in</a></p>

    <!--#include virtual="/partials/footer.html" -->
  </body>
</html>
