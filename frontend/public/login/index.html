<!doctype html>
<html lang="en">
  <head>
    <!--#set var="page_title" value="Log In — Dir Query" -->
    <!--#include virtual="/partials/head.html" -->
  </head>
  <body>
    <!--#include virtual="/partials/nav.html" -->

    <!--#set var="page_heading" value="Log In" -->
    <!--#include virtual="/partials/heading.html" -->

    <div id="form-error"></div>

    <form id="login-form" hx-post="/api/auth/login" hx-swap="none">
      <p>
        <label>
          Email
          <input type="email" name="email" required />
        </label>
      </p>
      <p>
        <label>
          Password
          <input type="password" name="password" required />
        </label>
      </p>
      <button type="submit">Log in</button>
    </form>

    <p><a href="/register">Need an account? Register</a></p>

    <script>
      document
        .getElementById("login-form")
        .addEventListener("htmx:afterRequest", function (evt) {
          const errorEl = document.getElementById("form-error");
          errorEl.textContent = "";

          let data;
          try {
            data = JSON.parse(evt.detail.xhr.response);
          } catch (e) {
            errorEl.textContent = evt.detail.xhr.response;
            return;
          }

          if (evt.detail.successful) {
            Auth.setSession(data.token, data.email);
            window.location = "/workspaces";
          } else {
            errorEl.textContent = data.detail || evt.detail.xhr.response;
          }
        });
    </script>

    <!--#include virtual="/partials/footer.html" -->
  </body>
</html>
