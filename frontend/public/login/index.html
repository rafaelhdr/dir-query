<!doctype html>
<html lang="en">
  <head>
    <!--#set var="page_title" value="Log In — Dir Query" -->
    <!--#include virtual="/partials/head.html" -->
  </head>
  <body>
    <!--#include virtual="/partials/nav.html" -->

    <!--#set var="page_heading" value="Log In" -->
    <!--#include virtual="/partials/heading.html" -->

    <div x-data="apiForm()">
      <div id="form-error" x-text="error"></div>

      <form
        id="login-form"
        @submit.prevent="submit('/api/auth/login', $event, (data) => { Auth.setSession(data.token, data.email); window.location = '/workspaces'; })"
      >
        <p>
          <label>
            Email
            <input type="email" name="email" required />
          </label>
        </p>
        <p>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
        </p>
        <button type="submit" :disabled="submitting">Log in</button>
      </form>
    </div>

    <p><a href="/register">Need an account? Register</a></p>

    <!--#include virtual="/partials/footer.html" -->
  </body>
</html>
