<!doctype html>
<!-- Origami Geometric — restrained tier (see DESIGN.md). -->
<html lang="en">
  <head>
    <!--#set var="page_title" value="Log In — Dir Query" -->
    <!--#include virtual="/partials/head.html" -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="origami-world origami-page">
    <!--#include virtual="/partials/nav.html" -->

    <!--#set var="page_heading" value="Log In" -->
    <!--#include virtual="/partials/heading.html" -->

    <div x-data="apiForm()">
      <div id="form-error" x-text="error"></div>

      <form
        id="login-form"
        @submit.prevent="submit('/api/auth/login', $event, (data) => { Auth.setSession(data.token, data.email); window.location = '/workspaces'; })"
      >
        <p>
          <label>
            Email
            <input type="email" name="email" required />
          </label>
        </p>
        <p>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
        </p>
        <button type="submit" class="origami-button-primary" :disabled="submitting">Log in</button>
      </form>
    </div>

    <p><a href="/register">Need an account? Register</a></p>

    <!--#include virtual="/partials/footer.html" -->
  </body>
</html>
