<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload — Understand Your Stuffs</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/htmx.min.js"></script>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/ask">Ask</a>
      <a href="/feed/upload">Upload</a>
    </nav>

    <h1>Upload <span class="beta-badge">Beta</span></h1>

    <p>
      Upload a PDF document to the server. Uploaded files are stored but
      not yet processed, indexed, or searchable.
    </p>

    <form
      hx-post="/api/uploads"
      hx-encoding="multipart/form-data"
      hx-target="#upload-result"
      hx-swap="innerHTML"
    >
      <input type="file" name="file" accept="application/pdf" required />
      <button type="submit">Upload</button>
    </form>

    <div id="upload-result"></div>

    <script>
      document.body.addEventListener("htmx:responseError", function (evt) {
        document.getElementById("upload-result").textContent =
          evt.detail.xhr.responseText;
      });
    </script>
  </body>
</html>
