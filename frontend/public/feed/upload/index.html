<!doctype html>
<html lang="en">
  <head>
    <!--#set var="page_title" value="Upload — Understand Your Stuffs" -->
    <!--#include virtual="/partials/head.html" -->
  </head>
  <body>
    <!--#include virtual="/partials/nav.html" -->

    <!--#set var="page_heading" value="Upload" -->
    <!--#include virtual="/partials/heading.html" -->

    <p>
      Upload a PDF document to the server. Uploaded files are stored but
      not yet processed, indexed, or searchable.
    </p>

    <form
      hx-post="/api/uploads"
      hx-encoding="multipart/form-data"
      hx-target="#upload-result"
      hx-swap="innerHTML"
    >
      <input type="file" name="file" accept="application/pdf" required />
      <button type="submit">Upload</button>
    </form>

    <div id="upload-result"></div>

    <script>
      document.body.addEventListener("htmx:responseError", function (evt) {
        document.getElementById("upload-result").textContent =
          evt.detail.xhr.responseText;
      });
    </script>
  </body>
</html>
