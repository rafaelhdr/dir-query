<!doctype html>
<!-- Origami Geometric — restrained tier (see DESIGN.md). -->
<html lang="en">
  <head>
    <!--#set var="page_title" value="Content — Dir Query" -->
    <!--#include virtual="/partials/head.html" -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="origami-world origami-page">
    <!--#include virtual="/partials/nav.html" -->

    <div x-data="filesPage()">
      <h1><span x-text="workspaceName"></span></h1>

      <nav class="workspace-tabs">
        <a :href="'/w/' + slug + '/ask'">Ask</a>
        <a :href="'/w/' + slug + '/feed/files'" class="active" aria-current="page">Content</a>
        <a x-show="canEdit" :href="'/w/' + slug + '/settings'">Settings</a>
      </nav>

      <p class="page-intro">Upload and manage the documents this workspace can search.</p>

      <!--#include virtual="/partials/ask-cta.html" -->

      <details id="add-content" x-show="canEdit">
        <summary>Add content</summary>
        <form @submit.prevent="upload($event)">
          <input
            type="file"
            name="file"
            accept="application/pdf"
            required
            @change="if ($event.target.files.length) nameInput = $event.target.files[0].name"
          />
          <input type="text" name="name" placeholder="Display name" required x-model="nameInput" />
          <button type="submit" class="origami-button-primary">Upload</button>
        </form>
        <div id="upload-result" x-text="uploadError"></div>
      </details>

      <div class="file-list-header">
        <h2>Files</h2>
        <button type="button" class="origami-button-secondary" @click="loadFiles()">Refresh</button>
      </div>

      <table id="file-list">
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="file in files" :key="file.id">
            <tr>
              <td>
                <span x-show="!file.editing" x-text="file.display_name"></span>
                <button
                  x-show="!file.editing && canEdit"
                  type="button"
                  class="edit-link origami-button-secondary"
                  @click="file.editing = true; file.editValue = file.display_name; file.editError = ''"
                >
                  Edit
                </button>
                <template x-if="file.editing">
                  <span>
                    <input
                      type="text"
                      x-model="file.editValue"
                      x-init="$nextTick(() => $el.focus())"
                      @keydown.enter.prevent="saveRename(file)"
                      @keydown.escape.prevent="file.editing = false"
                    />
                    <button type="button" class="origami-button-secondary" @click="saveRename(file)">Save</button>
                    <button type="button" class="origami-button-secondary" @click="file.editing = false">Cancel</button>
                    <div class="rename-error" x-text="file.editError"></div>
                  </span>
                </template>
              </td>
              <td x-text="file.status"></td>
              <td>
                <button type="button" class="origami-button-secondary" @click="window.open(file.url, '_blank', 'noopener')">
                  Open
                </button>
                <button x-show="canEdit" type="button" class="origami-button-secondary" @click="deleteFile(file.id)">
                  Delete
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <script>
      function filesPage() {
        return {
          slug: window.location.pathname.split("/")[2],
          workspaceName: "",
          canEdit: false,
          files: [],
          nameInput: "",
          uploadError: "",
          // Alpine auto-calls a component method literally named `init`
          // on mount — no `x-init="init()"` needed on the root element
          // (adding one too would run this twice).
          async init() {
            this.workspaceName = this.slug;
            try {
              const response = await Auth.fetch("/api/workspaces/" + this.slug);
              if (!response.ok) {
                this.workspaceName = "Workspace not found";
                return;
              }
              const workspace = await response.json();
              this.workspaceName = workspace.name;
              this.canEdit = workspace.can_edit;
              await this.loadFiles();
            } catch (e) {
              this.workspaceName = "Workspace not found";
            }
          },
          async loadFiles() {
            try {
              const response = await Auth.fetch("/api/w/" + this.slug + "/files");
              if (!response.ok) {
                this.files = [];
                return;
              }
              const body = await response.json();
              this.files = (body.data || []).map(function (file) {
                return Object.assign({}, file, {
                  editing: false,
                  editValue: "",
                  editError: "",
                });
              });
            } catch (e) {
              this.files = [];
            }
          },
          async deleteFile(fileId) {
            await Auth.fetch("/api/w/" + this.slug + "/files/" + fileId, {
              method: "DELETE",
            });
            await this.loadFiles();
          },
          async saveRename(file) {
            file.editError = "";
            const response = await Auth.fetch(
              "/api/w/" + this.slug + "/files/" + file.id,
              {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ display_name: file.editValue }),
              }
            );
            if (response.ok) {
              await this.loadFiles();
              return;
            }
            let detail = response.statusText;
            try {
              const body = await response.json();
              detail = body.detail || detail;
            } catch (e) {
              // response body wasn't JSON; fall back to statusText
            }
            file.editError = detail;
          },
          async upload(event) {
            this.uploadError = "";
            const formData = new FormData(event.target);
            const response = await Auth.fetch("/api/w/" + this.slug + "/files", {
              method: "POST",
              body: formData,
            });

            let data;
            try {
              data = await response.json();
            } catch (e) {
              this.uploadError = await response.text();
              return;
            }

            if (response.ok) {
              event.target.reset();
              this.nameInput = "";
              await this.loadFiles();
            } else {
              this.uploadError = data.detail || response.statusText;
            }
          },
        };
      }
    </script>

    <!--#include virtual="/partials/footer.html" -->
  </body>
</html>
