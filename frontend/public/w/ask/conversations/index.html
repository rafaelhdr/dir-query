<!doctype html>
<html lang="en">
  <head>
    <!--#set var="page_title" value="Past conversations — Dir Query" -->
    <!--#include virtual="/partials/head.html" -->
  </head>
  <body>
    <!--#include virtual="/partials/nav.html" -->

    <div x-data="conversationsPage()">
      <h1><span x-text="workspaceName"></span></h1>

      <nav class="workspace-tabs">
        <a :href="'/w/' + slug + '/ask'" class="active" aria-current="page">Ask</a>
        <a :href="'/w/' + slug + '/feed/files'">Content</a>
      </nav>

      <h2>Past conversations</h2>

      <div id="conversation-list">
        <p x-show="loaded && conversations.length === 0">
          No conversations yet. Ask a question to start one.
        </p>
        <ul x-show="conversations.length > 0">
          <template x-for="conversation in conversations" :key="conversation.id">
            <li>
              <a :href="'/w/' + slug + '/ask/' + conversation.id" x-text="conversation.title"></a>
              <span
                class="exchange-sources"
                x-text="' — ' + new Date(conversation.created_at).toLocaleString()"
              ></span>
            </li>
          </template>
        </ul>
      </div>
    </div>

    <script>
      function conversationsPage() {
        return {
          slug: window.location.pathname.split("/")[2],
          workspaceName: "",
          conversations: [],
          loaded: false,
          // Alpine auto-calls a component method literally named `init`
          // on mount — no `x-init="init()"` needed on the root element
          // (adding one too would run this twice).
          async init() {
            this.workspaceName = this.slug;
            try {
              const response = await fetch("/api/workspaces/" + this.slug);
              if (!response.ok) {
                this.workspaceName = "Workspace not found";
              } else {
                const workspace = await response.json();
                this.workspaceName = workspace.name;
              }
            } catch (e) {
              this.workspaceName = "Workspace not found";
            }

            try {
              const response = await fetch("/api/w/" + this.slug + "/conversations");
              if (response.ok) {
                const body = await response.json();
                this.conversations = body.data || [];
              }
            } catch (e) {
              // leave conversations empty
            }
            this.loaded = true;
          },
        };
      }
    </script>

    <!--#include virtual="/partials/footer.html" -->
  </body>
</html>
