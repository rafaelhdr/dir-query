<!doctype html>
<html lang="en">
  <head>
    <!--#set var="page_title" value="Ask — Understand Your Stuffs" -->
    <!--#include virtual="/partials/head.html" -->
  </head>
  <body>
    <!--#include virtual="/partials/nav.html" -->

    <h1><span id="workspace-name"></span> <span class="beta-badge">Beta</span></h1>

    <nav class="workspace-tabs">
      <a id="tab-ask" href="#" class="active" aria-current="page">Ask</a>
      <a id="tab-upload" href="#">Upload</a>
    </nav>

    <p>Ask a question about this workspace's uploaded documents.</p>

    <div id="answer"></div>

    <form id="ask-form" class="ask-form">
      <input type="text" name="question" placeholder="Ask a question" required />
      <button type="submit">Ask</button>
    </form>

    <script>
      const slug = window.location.pathname.split("/")[2];
      const workspaceNameEl = document.getElementById("workspace-name");
      workspaceNameEl.textContent = slug;
      document.getElementById("tab-ask").href = "/w/" + slug + "/ask";
      document.getElementById("tab-upload").href = "/w/" + slug + "/feed/upload";

      fetch("/api/workspaces/" + slug)
        .then(async function (response) {
          if (!response.ok) {
            workspaceNameEl.textContent = "Workspace not found";
            return;
          }
          const workspace = await response.json();
          workspaceNameEl.textContent = workspace.name;
        })
        .catch(function () {
          workspaceNameEl.textContent = "Workspace not found";
        });

      document.getElementById("ask-form").addEventListener("submit", async function (evt) {
        evt.preventDefault();
        const answerEl = document.getElementById("answer");
        answerEl.textContent = "";

        const formData = new FormData(evt.target);
        const response = await fetch("/api/w/" + slug + "/ask", {
          method: "POST",
          body: formData,
        });

        let data;
        try {
          data = await response.json();
        } catch (e) {
          answerEl.textContent = await response.text();
          return;
        }

        if (response.ok) {
          const answerP = document.createElement("p");
          answerP.textContent = data.answer;
          answerEl.appendChild(answerP);

          if (data.sources && data.sources.length) {
            const sourcesP = document.createElement("p");
            sourcesP.textContent = "Sources: " + data.sources.join(", ");
            answerEl.appendChild(sourcesP);
          }
        } else {
          answerEl.textContent = data.detail || response.statusText;
        }
      });
    </script>
  </body>
</html>
