<!doctype html>
<!--
  DIRECTION CONTRACT — Origami Geometric (ask page, restrained tier)
  THESIS: a flat sheet becomes dimensional through precise folds — the one
  fold-cut corner marks actionable/referenced elements only (buttons,
  source chips, the beta mark), never passive containers like entries.
  OWN-WORLD: paper (#FAFAFA) + ink (#1A1A1A) neutrals, one coral accent
  (#FF6B6B fill / #B34B4B text-on-light) for anything interactive. No
  tessellation, no hero, no motion here — Operate mode earns scanability
  over expression. Poppins carries all text. See DESIGN.md.
  STORY: a visitor's question becomes a new numbered entry in an ongoing
  record of rafaelhdr's documented experience — meticulous, checkable.
  FIRST VIEWPORT: workspace name as a plain heading; the entry log below,
  each numbered; the question input as the next line, with an accented
  submit button.
  FORM: replaces the retired "Lab Notebook" direction (dated-entry/desk-
  lamp conceit), which briefly governed this page alone. Origami Geometric
  is now the site's shared identity, expressed at full intensity on the
  home page and restrained here.
-->
<html lang="en">
  <head>
    <!--#set var="page_title" value="Ask — Dir Query" -->
    <!--#include virtual="/partials/head.html" -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="/marked.min.js"></script>
    <script src="/purify.min.js"></script>
  </head>
  <body class="origami-world ask-page">
    <!--#include virtual="/partials/nav.html" -->

    <div x-data="askPage()">
      <header class="page-cover">
        <h1><span x-text="workspaceName"></span></h1>
      </header>

      <nav class="workspace-tabs">
        <a :href="'/w/' + slug + '/ask'" class="active" aria-current="page">Ask</a>
        <a :href="'/w/' + slug + '/feed/files'">Content</a>
        <a x-show="canEdit" :href="'/w/' + slug + '/settings'">Settings</a>
      </nav>

      <p class="page-intro">Ask a question about this workspace's uploaded documents.</p>

      <div class="page-actions">
        <button
          type="button"
          class="origami-button-primary"
          x-show="exchanges.length > 0"
          @click="resetConversation()"
        >
          New question
        </button>
        <a
          :href="'/w/' + slug + '/ask/conversations'"
          :class="exchanges.length > 0 ? 'origami-button-secondary' : 'origami-button-primary'"
        >
          See past conversations
        </a>
      </div>

      <div id="exchanges">
        <template x-for="(exchange, index) in exchanges" :key="exchange.id">
          <div class="exchange">
            <p class="entry-stamp" x-text="'No. ' + String(index + 1).padStart(3, '0')"></p>
            <p class="exchange-question" x-text="exchange.question"></p>
            <div class="exchange-body">
              <p class="exchange-loading" x-show="exchange.status === 'loading'">Thinking…</p>
              <div class="exchange-content" x-show="exchange.status === 'streaming' || exchange.status === 'answered'">
                <div class="exchange-answer" x-html="exchange.answerHtml"></div>
                <p
                  class="exchange-sources"
                  x-show="exchange.status === 'answered' && exchange.sources.length"
                >
                  <span class="citation-label">Sources</span>
                  <template x-for="(source, index) in exchange.sources" :key="source.url">
                    <a class="citation-tab" :href="source.url" target="_blank" rel="noopener">
                      <span class="citation-tab-num" x-text="index + 1"></span>
                      <span x-text="source.name"></span>
                    </a>
                  </template>
                </p>
              </div>
              <p class="exchange-error" x-show="exchange.status === 'error'" x-text="exchange.errorMessage"></p>
            </div>
          </div>
        </template>
      </div>

      <form class="ask-form" @submit.prevent="submitQuestion()">
        <input
          type="text"
          x-model="question"
          placeholder="Ask a question"
          required
          :disabled="submitting"
          x-ref="questionInput"
        />
        <button type="submit" :disabled="submitting"><span aria-hidden="true">→</span> Ask</button>
      </form>
    </div>

    <script>
      // Force every link markdown produces to open safely in a new tab,
      // regardless of what the LLM-generated markdown source specified.
      DOMPurify.addHook("afterSanitizeAttributes", function (node) {
        if (node.tagName === "A") {
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noopener noreferrer");
        }
      });

      const MARKDOWN_ALLOWED_TAGS = [
        "p",
        "strong",
        "em",
        "ul",
        "ol",
        "li",
        "br",
        "code",
        "pre",
        "blockquote",
        "a",
      ];
      const MARKDOWN_ALLOWED_ATTR = ["href", "target", "rel"];

      // Answer text is LLM-generated (and ultimately traceable back to
      // user-uploaded PDF content), so it's untrusted. marked() only
      // parses markdown into HTML — it does not sanitize — so every
      // conversion is run through DOMPurify with a conservative allowlist
      // before the result is bound via x-html — the one deliberate,
      // sanitizer-guarded use of raw HTML binding on this page.
      function renderMarkdown(text) {
        const rawHtml = marked.parse(text);
        return DOMPurify.sanitize(rawHtml, {
          ALLOWED_TAGS: MARKDOWN_ALLOWED_TAGS,
          ALLOWED_ATTR: MARKDOWN_ALLOWED_ATTR,
        });
      }

      // Parses one SSE frame (everything between a "\n\n"-delimited chunk
      // of the response body) into {type, data}. Returns null for
      // heartbeat comment lines (`: keep-alive`) and blank frames.
      function parseSseFrame(frame) {
        if (!frame || frame.startsWith(":")) {
          return null;
        }
        let eventType = "message";
        const dataLines = [];
        frame.split("\n").forEach(function (line) {
          if (line.startsWith("event:")) {
            eventType = line.slice(6).trim();
          } else if (line.startsWith("data:")) {
            dataLines.push(line.slice(5).trim());
          }
        });
        if (dataLines.length === 0) {
          return null;
        }
        return { type: eventType, data: JSON.parse(dataLines.join("\n")) };
      }

      const ANSWER_RENDER_THROTTLE_MS = 80;

      function askPage() {
        return {
          slug: window.location.pathname.split("/")[2],
          pathConversationId: window.location.pathname.split("/")[4] || null,
          workspaceName: "",
          canEdit: false,
          exchanges: [],
          question: "",
          submitting: false,
          conversationId: null,
          nextExchangeId: 1,

          // Alpine auto-calls a component method literally named `init`
          // on mount — no `x-init="init()"` needed on the root element
          // (adding one too would run this twice, e.g. double-pushing
          // every exchange in loadConversation()).
          async init() {
            this.workspaceName = this.slug;
            try {
              const response = await Auth.fetch("/api/workspaces/" + this.slug);
              if (!response.ok) {
                this.workspaceName = "Workspace not found";
              } else {
                const workspace = await response.json();
                this.workspaceName = workspace.name;
                this.canEdit = workspace.can_edit;
              }
            } catch (e) {
              this.workspaceName = "Workspace not found";
            }

            if (this.pathConversationId) {
              await this.loadConversation(this.pathConversationId);
            }
          },

          async submitQuestion() {
            const question = this.question;
            const isFirstQuestion = this.conversationId === null;
            this.question = "";

            let exchange = {
              id: this.nextExchangeId++,
              question: question,
              status: "loading",
              answerHtml: "",
              sources: [],
              errorMessage: "",
            };
            this.exchanges.push(exchange);
            // Re-fetch the pushed item from the reactive array: Alpine wraps
            // it in a reactive proxy on push, and mutating the pre-push
            // plain-object reference (the `exchange` local above) bypasses
            // that proxy, so later mutations wouldn't trigger any DOM update.
            exchange = this.exchanges[this.exchanges.length - 1];

            const formData = new FormData();
            formData.set("question", question);
            if (this.conversationId) {
              formData.set("conversation_id", this.conversationId);
            }

            this.submitting = true;
            try {
              let response;
              try {
                response = await fetch("/api/w/" + this.slug + "/ask", {
                  method: "POST",
                  body: formData,
                });
              } catch (e) {
                exchange.status = "error";
                exchange.errorMessage =
                  "Something went wrong asking your question. Please try again.";
                return;
              }

              if (!response.ok) {
                let detail;
                try {
                  detail = (await response.json()).detail;
                } catch (e) {
                  // Non-JSON error body — fall back to statusText below.
                }
                exchange.status = "error";
                exchange.errorMessage = detail || response.statusText;
                return;
              }

              await this.streamAnswer(exchange, response, isFirstQuestion);
            } finally {
              this.submitting = false;
              this.$nextTick(() => this.$refs.questionInput.focus());
            }
          },

          // Reads the SSE response body, rendering the answer as Markdown
          // progressively (throttled) as "token" events arrive, and finishing
          // with an authoritative re-render + sources once "done" arrives.
          // The "done" event's answer is authoritative (not just the
          // concatenation of streamed tokens) because the backend can
          // canonicalize the final text (e.g. the "not found" answer) only
          // once generation completes.
          async streamAnswer(exchange, response, isFirstQuestion) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let accumulated = "";
            let lastRenderedAt = 0;
            let sawToken = false;

            const renderThrottled = (force) => {
              const now = Date.now();
              if (!force && now - lastRenderedAt < ANSWER_RENDER_THROTTLE_MS) {
                return;
              }
              lastRenderedAt = now;
              exchange.answerHtml = renderMarkdown(accumulated);
            };

            while (true) {
              let chunk;
              try {
                chunk = await reader.read();
              } catch (e) {
                exchange.status = "error";
                exchange.errorMessage =
                  "Something went wrong asking your question. Please try again.";
                return;
              }
              if (chunk.done) {
                break;
              }
              buffer += decoder.decode(chunk.value, { stream: true });

              let separatorIndex;
              while ((separatorIndex = buffer.indexOf("\n\n")) !== -1) {
                const frame = buffer.slice(0, separatorIndex);
                buffer = buffer.slice(separatorIndex + 2);
                const parsed = parseSseFrame(frame);
                if (!parsed) {
                  continue;
                }

                if (parsed.type === "token") {
                  sawToken = true;
                  exchange.status = "streaming";
                  accumulated += parsed.data;
                  renderThrottled(false);
                } else if (parsed.type === "done") {
                  accumulated = parsed.data.answer;
                  renderThrottled(true);
                  exchange.sources = parsed.data.sources || [];
                  exchange.status = "answered";
                  this.conversationId = parsed.data.conversation_id;
                  if (isFirstQuestion) {
                    window.history.replaceState(
                      {},
                      "",
                      "/w/" + this.slug + "/ask/" + this.conversationId
                    );
                  }
                  return;
                } else if (parsed.type === "error") {
                  exchange.status = "error";
                  exchange.errorMessage =
                    parsed.data.detail ||
                    "Something went wrong answering your question. Please try again.";
                  return;
                }
              }
            }

            // Connection ended without a "done"/"error" event.
            if (!sawToken) {
              exchange.status = "error";
              exchange.errorMessage =
                "Something went wrong asking your question. Please try again.";
            }
          },

          resetConversation() {
            this.conversationId = null;
            this.exchanges = [];
            window.history.replaceState({}, "", "/w/" + this.slug + "/ask");
          },

          async loadConversation(id) {
            try {
              const response = await fetch("/api/w/" + this.slug + "/conversations/" + id);
              if (!response.ok) {
                return;
              }
              const conversation = await response.json();
              this.conversationId = conversation.id;
              conversation.exchanges.forEach((ex) => {
                const exchange = {
                  id: this.nextExchangeId++,
                  question: ex.question,
                  status: "loading",
                  answerHtml: "",
                  sources: [],
                  errorMessage: "",
                };
                if (ex.status === "answered") {
                  exchange.status = "answered";
                  exchange.answerHtml = renderMarkdown(ex.answer);
                  exchange.sources = ex.sources || [];
                } else if (ex.status === "failed") {
                  exchange.status = "error";
                  exchange.errorMessage = "This question could not be answered.";
                }
                this.exchanges.push(exchange);
              });
            } catch (e) {
              // leave exchanges empty
            }
          },
        };
      }
    </script>

    <!--#include virtual="/partials/footer.html" -->
  </body>
</html>
