services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-understand_your_stuffs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-understand_your_stuffs}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-understand_your_stuffs} -d ${POSTGRES_DB:-understand_your_stuffs}"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/data/uploads:/data/uploads
      - ./backend/data/hf-cache:/data/hf-cache
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UPLOAD_DIR: /data/uploads
      HF_HOME: /data/hf-cache
      MINIMAX_LLM_MODEL: ${MINIMAX_LLM_MODEL:-MiniMax-M2.7}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER:-understand_your_stuffs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-understand_your_stuffs}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: ["./docker-entrypoint.sh", "--reload"]

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
