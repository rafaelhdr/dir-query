services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dir_query}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-dir_query}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dir_query} -d ${POSTGRES_DB:-dir_query}"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/scripts:/app/scripts
      - ./backend/data/uploads:/data/uploads
      - ./backend/data/hf-cache:/data/hf-cache
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UPLOAD_DIR: /data/uploads
      HF_HOME: /data/hf-cache
      EMBED_PROVIDER: ${EMBED_PROVIDER:-cpu}
      LLM_PROVIDER: ${LLM_PROVIDER:-minimax}
      MINIMAX_LLM_MODEL: ${MINIMAX_LLM_MODEL:-MiniMax-M2.7}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-3-flash-preview}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      POSTGRES_USER: ${POSTGRES_USER:-dir_query}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-dir_query}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: ["./docker-entrypoint.sh", "--reload"]

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./backend/data/uploads:/data/uploads:ro
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/public
          target: /usr/share/nginx/html
        - action: rebuild
          path: ./frontend/nginx.conf

volumes:
  postgres-data:
